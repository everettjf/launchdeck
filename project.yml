name: LaunchDeck
options:
  deploymentTarget:
    macOS: "26.0"

packages:
  LaunchDeckCore:
    path: Core

targets:
  LaunchDeck:
    type: application
    platform: macOS
    sources:
      - path: LaunchDeck
    dependencies:
      - package: LaunchDeckCore
        product: LaunchDeckCore
    info:
      path: LaunchDeck/Info.plist
      properties:
        CFBundleDisplayName: LaunchDeck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSAppleEventsUsageDescription: LaunchDeck reads the current Finder selection or browser tab when you press the LaunchDeck shortcut, so you can act on it.
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.everettjf.launchdeck.recipe
            CFBundleURLSchemes:
              - launchdeck
    entitlements:
      path: LaunchDeck/LaunchDeck.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everettjf.launchdeck
        PRODUCT_NAME: "$(TARGET_NAME)"
        MARKETING_VERSION: "2.0.13"
        CURRENT_PROJECT_VERSION: "2013"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: YPV49M8592
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_PREVIEWS: YES
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: NO
        ENABLE_RESOURCE_ACCESS_BLUETOOTH: NO
        ENABLE_RESOURCE_ACCESS_CALENDARS: NO
        ENABLE_RESOURCE_ACCESS_CAMERA: NO
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO
        ENABLE_RESOURCE_ACCESS_LOCATION: NO
        ENABLE_RESOURCE_ACCESS_PRINTING: NO
        ENABLE_RESOURCE_ACCESS_USB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # LaunchDeck/Info.plist (generated from `info` above) is the only Info.plist source.
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
  LaunchDeckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LaunchDeckTests
    dependencies:
      - target: LaunchDeck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

# Explicit scheme: the app target shares the project name "LaunchDeck", which
# makes XcodeGen's auto-scheme generation skip it.
schemes:
  LaunchDeck:
    build:
      targets:
        LaunchDeck: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LaunchDeckTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
