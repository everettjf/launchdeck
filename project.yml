name: LaunchDeck
options:
  deploymentTarget:
    macOS: "26.0"

packages:
  LaunchDeckCore:
    path: Core

targets:
  LaunchDeck:
    type: application
    platform: macOS
    sources:
      - path: LaunchDeck
    dependencies:
      - package: LaunchDeckCore
        product: LaunchDeckCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xnu.startmyapp
        PRODUCT_NAME: "$(TARGET_NAME)"
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "1500"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: YPV49M8592
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_PREVIEWS: YES
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: NO
        ENABLE_RESOURCE_ACCESS_BLUETOOTH: NO
        ENABLE_RESOURCE_ACCESS_CALENDARS: NO
        ENABLE_RESOURCE_ACCESS_CAMERA: NO
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO
        ENABLE_RESOURCE_ACCESS_LOCATION: NO
        ENABLE_RESOURCE_ACCESS_PRINTING: NO
        ENABLE_RESOURCE_ACCESS_USB: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LaunchDeck
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        REGISTER_APP_GROUPS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

# Explicit scheme: the app target shares the project name "LaunchDeck", which
# makes XcodeGen's auto-scheme generation skip it.
schemes:
  LaunchDeck:
    build:
      targets:
        LaunchDeck: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
